<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Prevent pinch-zoom so drag-and-drop pieces work naturally on touch screens -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a237e">
  <title>Chess AI</title>
  <link rel="stylesheet" href="chessboard.css">
  <style>
    /* ── Reset & Base ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #f0f0f0;
      overflow: hidden; /* prevent outer page scroll — inner panels scroll */
      color: #212121;
    }
    button { -webkit-tap-highlight-color: transparent; }

    /* ── Full-screen app wrapper ──────────────────────────────────────────── */
    #app {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       AUTH SCREEN  (shown before login)
    ═══════════════════════════════════════════════════════════════════════ */
    .auth-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      background: linear-gradient(160deg, #1a237e 0%, #283593 50%, #1565c0 100%);
    }
    .auth-logo {
      font-size: 3.5em;
      margin-bottom: 6px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
    }
    .auth-title {
      color: white;
      font-size: 1.55em;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin: 0 0 4px;
    }
    .auth-subtitle {
      color: rgba(255,255,255,0.7);
      font-size: 0.85em;
      margin: 0 0 28px;
    }
    .auth-card {
      background: white;
      border-radius: 12px;
      padding: 20px 18px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .auth-card h3 {
      margin: 0 0 16px;
      font-size: 1.1em;
      color: #1a237e;
    }
    .auth-field {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 1em;
      margin-bottom: 10px;
      transition: border-color 0.2s;
      outline: none;
    }
    .auth-field:focus { border-color: #1565c0; }
    .auth-error {
      color: #c62828;
      font-size: 0.85em;
      margin: 0 0 10px;
      display: none;
    }
    .auth-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      transition: filter 0.15s;
    }
    .auth-btn:active { filter: brightness(0.9); }
    .auth-btn-primary { background: #1565c0; color: white; }
    .auth-btn-disabled { background: #b0bec5; color: white; cursor: not-allowed; }
    .auth-btn-danger  { background: #c62828; color: white; }
    .auth-already-info { color: #555; font-size: 0.9em; margin: 0 0 14px; text-align: center; }

    /* ═══════════════════════════════════════════════════════════════════════
       GAME SCREEN  (shown after login)
    ═══════════════════════════════════════════════════════════════════════ */

    /* ── Fixed header bar ─────────────────────────────────────────────────── */
    .m-header {
      flex-shrink: 0;
      height: 48px;
      background: #1a237e;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 200;
    }
    .m-header-title {
      font-size: 1.05em;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .m-header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .m-header-user {
      font-size: 0.8em;
      color: rgba(255,255,255,0.8);
    }
    .m-header-logout {
      padding: 6px 10px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 6px;
      color: white;
      font-size: 0.8em;
      cursor: pointer;
    }
    .m-header-logout:active { background: rgba(255,255,255,0.3); }

    /* ── Scrollable game body (between header and bottom nav) ─────────────── */
    .m-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Board section ─────────────────────────────────────────────────────── */
    .m-board-section {
      flex-shrink: 0;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 4px 4px;
      border-bottom: 1px solid #e0e0e0;
    }

    /* Sync game-id banner */
    .m-sync-banner {
      display: none;
      width: 100%;
      text-align: center;
      padding: 4px 8px;
      background: #fff8e1;
      border: 1px solid #f9a825;
      border-radius: 6px;
      font-family: monospace;
      font-size: 11px;
      margin-bottom: 4px;
    }

    /* Board wrapper — sets the size used by chessboard.js */
    #board {
      /* Width is set dynamically via JS; height follows automatically from chessboard.js */
    }

    /* ── Compact info strip below the board ───────────────────────────────── */
    .m-info-strip {
      width: 100%;
      max-width: 412px; /* S23 Ultra max */
      padding: 4px 8px 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .m-game-status {
      text-align: center;
      font-size: 0.82em;
      font-weight: 600;
      color: #333;
      min-height: 18px;
    }
    .m-game-status.gs-check     { color: #e65100; }
    .m-game-status.gs-checkmate { color: #c62828; }
    .m-game-status.gs-draw      { color: #1565c0; }
    .m-game-status.gs-stalemate { color: #6a1b9a; }
    .m-players-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.76em;
      color: #555;
    }
    .m-player-white::before { content: '♔ '; }
    .m-player-black::before { content: '♚ '; }
    .m-captured-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.76em;
      color: #555;
    }
    .m-captured-label { font-weight: 600; }
    .m-captured-pieces { font-size: 1.3em; letter-spacing: 1px; }
    .m-material-adv {
      font-size: 0.75em;
      font-weight: 700;
      color: #555;
      text-align: center;
    }

    /* ── Tab navigation bar ────────────────────────────────────────────────── */
    .m-tab-nav {
      flex-shrink: 0;
      display: flex;
      background: #fff;
      border-bottom: 2px solid #e0e0e0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .m-tab-nav::-webkit-scrollbar { display: none; }
    .m-tab-btn {
      flex: 1;
      min-width: 64px;
      padding: 10px 6px;
      border: none;
      background: none;
      font-size: 0.72em;
      font-weight: 600;
      color: #777;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      white-space: nowrap;
      transition: color 0.15s;
    }
    .m-tab-btn.active {
      color: #1565c0;
      border-bottom-color: #1565c0;
    }
    .m-tab-btn:active { background: #f5f5f5; }

    /* ── Tab content area (scrollable) ─────────────────────────────────────── */
    .m-tab-area {
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    .m-tab-panel {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px;
      display: none;
      background: #fafafa;
    }
    .m-tab-panel.active { display: block; }

    /* ── Status log (in-game feed) ─────────────────────────────────────────── */
    .m-status-log {
      font-family: monospace;
      font-size: 11px;
      background: #1a1a1a;
      color: #e0e0e0;
      border-radius: 8px;
      padding: 8px 10px;
      max-height: 120px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      margin-bottom: 10px;
    }
    .m-status-log div { line-height: 1.7; }
    .sl-success { color: #69f0ae; }
    .sl-error   { color: #ff5252; }
    .sl-info    { color: #82b1ff; }
    .sl-time    { color: #757575; }

    /* ── Move history list ─────────────────────────────────────────────────── */
    .m-move-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88em;
    }
    .m-move-table th {
      background: #e8eaf6;
      padding: 6px 10px;
      text-align: left;
      font-size: 0.85em;
      color: #3949ab;
      font-weight: 700;
    }
    .m-move-table td {
      padding: 6px 10px;
      border-bottom: 1px solid #f0f0f0;
    }
    .m-move-table tr:last-child td { border-bottom: none; }
    .m-move-empty { color: #999; text-align: center; padding: 20px 0; font-size: 0.88em; }

    /* ── Player Setup form ──────────────────────────────────────────────────── */
    .m-setup-section {
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .m-setup-section h4 {
      margin: 0 0 10px;
      font-size: 0.9em;
      color: #1a237e;
      border-bottom: 1px solid #e8eaf6;
      padding-bottom: 6px;
    }
    .m-field-label {
      display: block;
      font-size: 0.8em;
      color: #555;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .m-field-input, .m-field-select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #ddd;
      border-radius: 6px;
      font-size: 0.95em;
      margin-bottom: 10px;
      outline: none;
      background: white;
      -webkit-appearance: none;
      appearance: none;
    }
    .m-field-input:focus, .m-field-select:focus { border-color: #1565c0; }
    .m-field-row {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .m-field-row > * { flex: 1; }

    /* ── Action buttons ─────────────────────────────────────────────────────── */
    .m-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-size: 0.95em;
      font-weight: 700;
      cursor: pointer;
      transition: filter 0.15s;
      margin-bottom: 8px;
    }
    .m-btn:active { filter: brightness(0.88); }
    .m-btn-primary  { background: #1565c0; color: white; }
    .m-btn-success  { background: #2e7d32; color: white; }
    .m-btn-danger   { background: #c62828; color: white; }
    .m-btn-outline  { background: white; color: #1565c0; border: 2px solid #1565c0; }
    .m-btn-sm {
      width: auto;
      padding: 8px 14px;
      font-size: 0.85em;
      margin-bottom: 0;
    }

    /* ── Expert Q&A panel ──────────────────────────────────────────────────── */
    .m-expert-input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .m-expert-input {
      flex: 1;
      padding: 10px 12px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 0.9em;
      outline: none;
    }
    .m-expert-input:focus { border-color: #1565c0; }
    .m-expert-send {
      padding: 10px 16px;
      background: #1565c0;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9em;
    }
    .m-expert-quick-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .m-expert-quick {
      padding: 7px 12px;
      background: #e8eaf6;
      border: 1px solid #c5cae9;
      border-radius: 16px;
      font-size: 0.78em;
      font-weight: 600;
      color: #283593;
      cursor: pointer;
    }
    .m-expert-quick:active { background: #c5cae9; }
    .m-expert-qa {
      background: white;
      border: 1px solid #e8eaf6;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .m-expert-question {
      padding: 8px 12px;
      background: #e8eaf6;
      color: #283593;
      font-size: 0.85em;
      font-weight: 600;
    }
    .m-expert-answer {
      padding: 8px 12px;
      font-size: 0.85em;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    /* ── Game tab welcome quick-buttons ────────────────────────────────────── */
    .m-quick-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .m-quick-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 12px 8px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      font-size: 0.8em;
      font-weight: 600;
      color: #333;
      transition: all 0.15s;
    }
    .m-quick-btn:active { background: #e3f2fd; border-color: #1565c0; }
    .m-quick-btn .qb-icon { font-size: 1.8em; }
    .m-quick-btn.qb-primary  { border-color: #2e7d32; background: #f1f8f1; color: #2e7d32; }
    .m-quick-btn.qb-continue { border-color: #e65100; background: #fff8f0; color: #e65100; }

    /* ── Board orientation button ───────────────────────────────────────────── */
    .m-board-controls {
      display: flex;
      justify-content: flex-end;
      width: 100%;
      max-width: 412px;
      padding: 0 0 2px;
      gap: 6px;
    }
    .m-board-ctrl-btn {
      padding: 4px 10px;
      font-size: 0.72em;
      background: #e8eaf6;
      border: 1px solid #c5cae9;
      border-radius: 5px;
      color: #283593;
      cursor: pointer;
      font-weight: 600;
    }
    .m-board-ctrl-btn:active { background: #c5cae9; }

    /* ── Toast notification ─────────────────────────────────────────────────── */
    .m-toast {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #323232;
      color: white;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 0.85em;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 500;
      pointer-events: none;
      white-space: nowrap;
      max-width: 90vw;
      text-align: center;
    }
    .m-toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Saving indicator ───────────────────────────────────────────────────── */
    .m-saved-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.72em;
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
      margin-left: 6px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div id="app"><!-- Populated by JavaScript --></div>

  <!-- Toast notification element (shared) -->
  <div id="m-toast" class="m-toast"></div>

  <!-- External libraries -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="chessboard.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <script>
    // ────────────────────────────────────────────────────────────────────────
    // Global State
    // ────────────────────────────────────────────────────────────────────────
    let authToken   = null;
    let currentUser = null;
    let board       = null;
    let game        = null;

    let moveHistory     = [];
    let capturedByWhite = []; // black pieces captured by White
    let capturedByBlack = []; // white pieces captured by Black
    let currentPlayerColor = null;   // 'white' | 'black'
    let currentOpponent    = null;
    let gameResultRecorded = false;

    // Comm log buffer (kept even before the Comm tab renders)
    let commMessages = [];

    // Player stats stored in localStorage
    let playerStats = JSON.parse(localStorage.getItem('chessPlayerStats') || '{}');

    // ─── Piece symbol maps ───────────────────────────────────────────────────
    const PIECE_SYMBOLS = {
      p: { w: '♙', b: '♟' },
      n: { w: '♘', b: '♞' },
      b: { w: '♗', b: '♝' },
      r: { w: '♖', b: '♜' },
      q: { w: '♕', b: '♛' },
      k: { w: '♔', b: '♚' }
    };
    const PIECE_VALUES = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };

    // ────────────────────────────────────────────────────────────────────────
    // Auth helpers
    // ────────────────────────────────────────────────────────────────────────
    function checkAuthentication() {
      const token = localStorage.getItem('authToken');
      const user  = localStorage.getItem('currentUser');
      if (!token) { showLoginScreen(); return; }
      authToken   = token;
      currentUser = user;
      verifyToken(token);
    }

    function showLoginScreen() {
      document.getElementById('app').innerHTML = `
        <div class="auth-screen">
          <div class="auth-logo">♟</div>
          <h1 class="auth-title">Chess AI</h1>
          <p class="auth-subtitle">Play, learn, and improve your game</p>
          <div class="auth-card">
            <h3>Sign In</h3>
            <input id="login-username" class="auth-field" type="text"
              placeholder="Username" autocomplete="username" autocapitalize="none"
              onkeydown="if(event.key==='Enter')document.getElementById('login-password').focus()">
            <input id="login-password" class="auth-field" type="password"
              placeholder="Password" autocomplete="current-password"
              onkeydown="if(event.key==='Enter')handleLogin()">
            <div id="login-error" class="auth-error"></div>
            <button class="auth-btn auth-btn-primary" onclick="handleLogin()">Login</button>
            <button class="auth-btn auth-btn-disabled" disabled
              title="Registration is temporarily unavailable">Register (Unavailable)</button>
          </div>
        </div>`;
    }

    function showAlreadyLoggedIn(username, isAdmin) {
      const role = isAdmin ? 'Admin' : 'Player';
      document.getElementById('app').innerHTML = `
        <div class="auth-screen">
          <div class="auth-logo">♟</div>
          <h1 class="auth-title">Welcome back!</h1>
          <div class="auth-card">
            <p class="auth-already-info">Signed in as <strong>${username}</strong> (${role})</p>
            ${isAdmin
              ? `<button class="auth-btn auth-btn-primary"
                   onclick="window.location.href='admin.html'">Admin Dashboard</button>`
              : `<button class="auth-btn auth-btn-primary"
                   onclick="loadGameScreen()">Continue Playing</button>`}
            <button class="auth-btn auth-btn-danger" onclick="handleSwitchUser()">
              Logout / Switch Account
            </button>
          </div>
        </div>`;
    }

    function handleLogin() {
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const errEl    = document.getElementById('login-error');
      if (!username || !password) {
        errEl.textContent = 'Please enter username and password.';
        errEl.style.display = 'block';
        return;
      }
      errEl.style.display = 'none';
      logComm('req', 'AUTH', '/auth/login', { username });
      let _st = null;
      fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      })
        .then(r => { _st = r.status; return r.json(); })
        .then(data => {
          logComm('res', 'AUTH', '/auth/login', data, _st);
          if (data.success && data.token) {
            _storeAuth(data.token, username, data.is_admin);
            if (data.is_admin) { window.location.href = 'admin.html'; }
            else { loadGameScreen(); }
          } else if (data.use_admin_login) {
            // Admin accounts authenticate through the secure internal endpoint
            logComm('req', 'AUTH', '/admin-auth/login', { username });
            let _ast = null;
            fetch('/admin-auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username, password })
            })
              .then(r2 => { _ast = r2.status; return r2.json(); })
              .then(ad => {
                logComm('res', 'AUTH', '/admin-auth/login', ad, _ast);
                if (ad.success && ad.token) {
                  _storeAuth(ad.token, username, true);
                  window.location.href = 'admin.html';
                } else {
                  errEl.textContent = ad.message || 'Admin login failed.';
                  errEl.style.display = 'block';
                }
              })
              .catch(e => { errEl.textContent = 'Error: ' + e.message; errEl.style.display = 'block'; });
          } else {
            errEl.textContent = data.detail || data.message || 'Login failed.';
            errEl.style.display = 'block';
          }
        })
        .catch(e => { errEl.textContent = 'Error: ' + e.message; errEl.style.display = 'block'; });
    }

    function _storeAuth(token, username, isAdmin) {
      authToken   = token;
      currentUser = username;
      localStorage.setItem('authToken', token);
      localStorage.setItem('currentUser', username);
      localStorage.setItem('isAdmin', isAdmin ? 'true' : 'false');
    }

    function verifyToken(token) {
      fetch('/auth/verify', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token }
      })
        .then(r => r.json())
        .then(data => {
          if (data.success) {
            currentUser = data.username;
            localStorage.setItem('isAdmin', data.is_admin ? 'true' : 'false');
            showAlreadyLoggedIn(data.username, data.is_admin);
          } else {
            localStorage.removeItem('authToken');
            localStorage.removeItem('currentUser');
            localStorage.removeItem('isAdmin');
            showLoginScreen();
          }
        })
        .catch(() => {
          // If the verify call fails (e.g., offline) still try to load game
          loadGameScreen();
        });
    }

    function handleLogout() {
      if (!confirm('Are you sure you want to logout?')) return;
      fetch('/auth/logout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: authToken })
      }).catch(() => {}).finally(() => {
        authToken   = null;
        currentUser = null;
        localStorage.removeItem('authToken');
        localStorage.removeItem('currentUser');
        localStorage.removeItem('isAdmin');
        showLoginScreen();
      });
    }

    function handleSwitchUser() {
      const token = localStorage.getItem('authToken');
      if (token) {
        fetch('/auth/logout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        }).catch(() => {}).finally(() => {
          localStorage.removeItem('authToken');
          localStorage.removeItem('currentUser');
          localStorage.removeItem('isAdmin');
          showLoginScreen();
        });
      } else {
        localStorage.removeItem('authToken');
        localStorage.removeItem('currentUser');
        showLoginScreen();
      }
    }

    // ────────────────────────────────────────────────────────────────────────
    // Board Initialization & Handlers
    // ────────────────────────────────────────────────────────────────────────
    function calcBoardSize() {
      // Use 4px margin each side; cap at 404px (S23 Ultra max physical width in CSS px)
      return Math.min(window.innerWidth - 8, 404);
    }

    function initBoard() {
      game = new Chess();
      moveHistory = [];
      capturedByWhite = [];
      capturedByBlack = [];

      const sz = calcBoardSize();
      const boardEl = document.getElementById('board');
      if (!boardEl) return;
      boardEl.style.width  = sz + 'px';
      boardEl.style.height = sz + 'px';

      board = Chessboard('board', {
        position: 'start',
        draggable: true,
        onDrop: onDropM,
        onDragStart: onDragStartM,
        onSnapEnd: onSnapEndM,
        pieceTheme: 'img/chesspieces/wikipedia/{piece}.png',
        dropOffBoard: 'snapback',
        touchMove: true  // enable touch drag on mobile
      });
    }

    function onDragStartM(source, piece) {
      if (!game || game.game_over()) return false;
      // Prevent dragging the wrong colour
      if (game.turn() === 'w' && piece.search(/^b/) !== -1) return false;
      if (game.turn() === 'b' && piece.search(/^w/) !== -1) return false;
      return true;
    }

    function onDropM(source, target) {
      if (!game) return 'snapback';
      const move = game.move({ from: source, to: target, promotion: 'q' });
      if (move === null) return 'snapback';

      updateMoveHistoryM(move.san, 'You');
      updateCapturedPiecesM(move);
      updateFenDisplayM();
      checkGameStatus();
      logStatus(`You played: ${move.san}`, 'info');

      // Determine if AI should respond
      const blackType = getPlayerType('black');
      const whiteType = getPlayerType('white');
      const needsAI =
        (game.turn() === 'b' && blackType === 'ai') ||
        (game.turn() === 'w' && whiteType === 'ai');

      sendMoveToEngineM(source + target, game.fen(), needsAI);
      checkGameStatus();
      saveGameM();
    }

    function onSnapEndM() {
      if (board && game) board.position(game.fen());
    }

    function flipBoardM() {
      if (board) board.flip();
    }

    // Resize board when orientation changes
    window.addEventListener('resize', () => {
      if (!board) return;
      const sz = calcBoardSize();
      const boardEl = document.getElementById('board');
      if (boardEl) {
        boardEl.style.width  = sz + 'px';
        boardEl.style.height = sz + 'px';
        board.resize();
      }
    });

    // ────────────────────────────────────────────────────────────────────────
    // Game Logic
    // ────────────────────────────────────────────────────────────────────────
    function getPlayerType(color) {
      const el = document.getElementById(color === 'white' ? 'm-white-player' : 'm-black-player');
      return el ? el.value : 'ai';
    }
    function getAiType(color) {
      const el = document.getElementById(color === 'white' ? 'm-white-ai-type' : 'm-black-ai-type');
      return el ? el.value : 'stockfish';
    }
    function getSkillLevel(color) {
      const el = document.getElementById(color === 'white' ? 'm-white-skill' : 'm-black-skill');
      return el ? (parseInt(el.value) || 10) : 10;
    }

    function startNewGameM() {
      if (!game) return;

      const whiteType = getPlayerType('white');
      const blackType = getPlayerType('black');
      currentPlayerColor = (whiteType === 'human') ? 'white' : 'black';
      currentOpponent    = buildOpponentLabel();
      gameResultRecorded = false;

      game = new Chess();
      moveHistory = [];
      capturedByWhite = [];
      capturedByBlack = [];

      if (board) board.start();
      renderCapturedPieces();
      updateFenDisplayM();
      checkGameStatus();
      updatePlayerDisplayM();

      const hist = document.getElementById('m-move-history-content');
      if (hist) hist.innerHTML = '<p class="m-move-empty">No moves yet.</p>';
      const expert = document.getElementById('m-expert-answers');
      if (expert) expert.innerHTML = '';

      logStatus(`New game started: White=${whiteType}, Black=${blackType}`, 'success');
      switchMobileTab('game');
      showToast('New game started!');
      postActivityM('playing');

      // If White is AI, request first move
      if (whiteType === 'ai') {
        setTimeout(() => sendMoveToEngineM('', game.fen(), true), 600);
      }
    }

    function buildOpponentLabel() {
      const blackType = getPlayerType('black');
      if (blackType === 'ai') {
        const aiT = getAiType('black');
        const lvl = getSkillLevel('black');
        return `${aiT} (Level ${lvl})`;
      }
      const nameEl = document.getElementById('m-black-name');
      return (nameEl && nameEl.value.trim()) ? nameEl.value.trim() : 'Human';
    }

    function sendMoveToEngineM(move, fen, requestAiMove) {
      const isWhiteTurn = game && game.turn() === 'w';
      const aiColor  = isWhiteTurn ? 'white' : 'black';
      const aiType   = getAiType(aiColor);
      const skillLvl = getSkillLevel(aiColor);

      logComm('req', 'ENGINE', '/move', { move, fen, request_ai_move: requestAiMove, ai_type: aiType, skill_level: skillLvl });
      let _st = null;
      fetch('/move', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + authToken
        },
        body: JSON.stringify({
          move: move,
          fen: fen,
          request_ai_move: requestAiMove,
          ai_type: aiType,
          skill_level: skillLvl
        })
      })
        .then(r => {
          _st = r.status;
          if (r.status === 401) { handleLogout(); throw new Error('Unauthorized'); }
          return r.json();
        })
        .then(data => {
          logComm('res', 'ENGINE', '/move', data, _st);
          if (data.error) { logStatus(`Server error: ${data.error}`, 'error'); return; }
          logStatus('Move confirmed ✓', 'success');

          if (data.ai_move) {
            const from = data.ai_move.substring(0, 2);
            const to   = data.ai_move.substring(2, 4);
            const prom = data.ai_move.length > 4 ? data.ai_move[4] : 'q';

            const aiResult = game.move({ from, to, promotion: prom });
            if (aiResult) {
              board.position(game.fen());
              updateCapturedPiecesM(aiResult);
              const san = data.ai_move_san || aiResult.san;
              updateMoveHistoryM(san, currentOpponent || 'AI');
              updateFenDisplayM();
              logStatus(`AI played: ${san} (${data.ai_type})`, 'info');
              checkGameStatus();
              saveGameM();
              updateExpertContextBadgeM();

              // If the next turn is also AI, keep going
              if (!game.game_over()) {
                const nextColor = game.turn() === 'w' ? 'white' : 'black';
                if (getPlayerType(nextColor) === 'ai') {
                  setTimeout(() => sendMoveToEngineM('', game.fen(), true), 900);
                }
              }
            } else {
              // Sync fallback
              if (data.fen) { game.load(data.fen); board.position(data.fen); }
              logStatus('Board synced with server', 'info');
            }
          }
        })
        .catch(e => {
          if (e.message !== 'Unauthorized') logStatus(`Error: ${e.message}`, 'error');
        });
    }

    function checkGameStatus() {
      if (!game) return;
      const el = document.getElementById('m-game-status');
      let text = '';
      let cls  = '';

      if (game.in_checkmate()) {
        text = game.turn() === 'w' ? 'Black wins — Checkmate!' : 'White wins — Checkmate!';
        cls  = 'gs-checkmate';
        const humanWon = (currentPlayerColor === 'white' && game.turn() === 'b') ||
                         (currentPlayerColor === 'black' && game.turn() === 'w');
        recordGameResult(humanWon ? 'win' : 'loss');
      } else if (game.in_draw()) {
        text = 'Draw!';
        cls  = 'gs-draw';
        recordGameResult('draw');
      } else if (game.in_stalemate()) {
        text = 'Stalemate — Draw!';
        cls  = 'gs-stalemate';
        recordGameResult('draw');
      } else if (game.in_check()) {
        text = game.turn() === 'w' ? '⚠ White is in check' : '⚠ Black is in check';
        cls  = 'gs-check';
      } else {
        text = game.turn() === 'w' ? "White's turn" : "Black's turn";
        cls  = '';
      }

      if (el) { el.textContent = text; el.className = 'm-game-status ' + cls; }
    }

    function recordGameResult(result) {
      if (gameResultRecorded || !currentOpponent) return;
      gameResultRecorded = true;
      if (!playerStats[currentOpponent]) playerStats[currentOpponent] = { w: 0, l: 0, d: 0 };
      if (result === 'win')  playerStats[currentOpponent].w++;
      if (result === 'loss') playerStats[currentOpponent].l++;
      if (result === 'draw') playerStats[currentOpponent].d++;
      localStorage.setItem('chessPlayerStats', JSON.stringify(playerStats));
      postActivityM('idle');
    }

    // ────────────────────────────────────────────────────────────────────────
    // Captured Pieces
    // ────────────────────────────────────────────────────────────────────────
    function updateCapturedPiecesM(move) {
      if (!move || !move.captured) return;
      if (move.color === 'w') capturedByWhite.push(move.captured);
      else                    capturedByBlack.push(move.captured);
      renderCapturedPieces();
    }

    function renderCapturedPieces() {
      const whiteEl = document.getElementById('m-white-captured');
      const blackEl = document.getElementById('m-black-captured');
      const advEl   = document.getElementById('m-material-adv');
      const wScEl   = document.getElementById('m-white-score');
      const bScEl   = document.getElementById('m-black-score');
      if (!whiteEl || !blackEl) return;

      const sort = arr => [...arr].sort((a, b) => PIECE_VALUES[b] - PIECE_VALUES[a]);
      whiteEl.textContent = sort(capturedByWhite).map(p => PIECE_SYMBOLS[p]['b']).join('') || '—';
      blackEl.textContent = sort(capturedByBlack).map(p => PIECE_SYMBOLS[p]['w']).join('') || '—';

      const wMat = capturedByWhite.reduce((s, p) => s + (PIECE_VALUES[p] || 0), 0);
      const bMat = capturedByBlack.reduce((s, p) => s + (PIECE_VALUES[p] || 0), 0);
      if (wScEl) wScEl.textContent = wMat > 0 ? `+${wMat}` : '';
      if (bScEl) bScEl.textContent = bMat > 0 ? `+${bMat}` : '';

      const diff = wMat - bMat;
      if (advEl) {
        if (diff > 0)      { advEl.textContent = `+${diff} W`; advEl.style.color = '#2e7d32'; }
        else if (diff < 0) { advEl.textContent = `+${Math.abs(diff)} B`; advEl.style.color = '#1565c0'; }
        else               { advEl.textContent = wMat > 0 ? '=' : ''; advEl.style.color = '#555'; }
      }
    }

    // ────────────────────────────────────────────────────────────────────────
    // Move History
    // ────────────────────────────────────────────────────────────────────────
    function updateMoveHistoryM(move, playerLabel) {
      moveHistory.push({ move, player: playerLabel });
      renderMoveHistory();
    }

    function renderMoveHistory() {
      const container = document.getElementById('m-move-history-content');
      if (!container) return;
      if (!moveHistory.length) {
        container.innerHTML = '<p class="m-move-empty">No moves yet.</p>';
        return;
      }
      let rows = '';
      for (let i = 0; i < moveHistory.length; i += 2) {
        const n  = Math.floor(i / 2) + 1;
        const wm = moveHistory[i]     ? `${moveHistory[i].player}: ${moveHistory[i].move}` : '';
        const bm = moveHistory[i + 1] ? `${moveHistory[i + 1].player}: ${moveHistory[i + 1].move}` : '';
        rows += `<tr><td style="width:28px;color:#999;font-size:0.8em;">${n}.</td>
                     <td>${wm}</td><td>${bm}</td></tr>`;
      }
      container.innerHTML = `
        <table class="m-move-table">
          <thead><tr><th>#</th><th>White</th><th>Black</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    // ────────────────────────────────────────────────────────────────────────
    // Player Setup UI helpers
    // ────────────────────────────────────────────────────────────────────────
    function updatePlayerConfigM() {
      const wType = getPlayerType('white');
      const bType = getPlayerType('black');

      const wHuman = document.getElementById('m-white-human-cfg');
      const wAi    = document.getElementById('m-white-ai-cfg');
      const bHuman = document.getElementById('m-black-human-cfg');
      const bAi    = document.getElementById('m-black-ai-cfg');

      if (wHuman) wHuman.style.display = wType === 'human' ? '' : 'none';
      if (wAi)    wAi.style.display    = wType === 'ai'    ? '' : 'none';
      if (bHuman) bHuman.style.display = bType === 'human' ? '' : 'none';
      if (bAi)    bAi.style.display    = bType === 'ai'    ? '' : 'none';

      // Auto-fill the human player's name from the logged-in user
      if (wType === 'human') {
        const nameEl = document.getElementById('m-white-name');
        if (nameEl && !nameEl.value && currentUser) nameEl.value = currentUser;
      }

      updatePlayerDisplayM();
    }

    function updatePlayerDisplayM() {
      const wType = getPlayerType('white');
      const bType = getPlayerType('black');

      let wLabel, bLabel;
      if (wType === 'human') {
        const nameEl = document.getElementById('m-white-name');
        const name = (nameEl && nameEl.value.trim()) ? nameEl.value.trim() : (currentUser || 'Player 1');
        wLabel = `White: ${name}`;
      } else {
        wLabel = `White: ${getAiType('white')} Lv ${getSkillLevel('white')}`;
      }
      if (bType === 'human') {
        const nameEl = document.getElementById('m-black-name');
        const name = (nameEl && nameEl.value.trim()) ? nameEl.value.trim() : 'Player 2';
        bLabel = `Black: ${name}`;
      } else {
        bLabel = `Black: ${getAiType('black')} Lv ${getSkillLevel('black')}`;
      }

      const wEl = document.getElementById('m-white-player-display');
      const bEl = document.getElementById('m-black-player-display');
      if (wEl) wEl.textContent = wLabel;
      if (bEl) bEl.textContent = bLabel;
    }

    // ────────────────────────────────────────────────────────────────────────
    // FEN Display
    // ────────────────────────────────────────────────────────────────────────
    function updateFenDisplayM() {
      // FEN is not shown in a separate box on mobile to save space,
      // but kept here for future use / expert context.
    }

    // ────────────────────────────────────────────────────────────────────────
    // Save / Load Game
    // ────────────────────────────────────────────────────────────────────────
    function saveGameM() {
      if (!game) return;
      const key    = 'mobileChessSave_' + (currentUser || 'guest');
      const saves  = JSON.parse(localStorage.getItem(key) || '[]');
      const record = {
        id:       Date.now(),
        fen:      game.fen(),
        moves:    moveHistory.slice(),
        white:    document.getElementById('m-white-player')?.value || 'human',
        black:    document.getElementById('m-black-player')?.value || 'ai',
        aiType:   getAiType('black'),
        skillLvl: getSkillLevel('black'),
        capturedW: capturedByWhite.slice(),
        capturedB: capturedByBlack.slice(),
        savedAt:  new Date().toISOString()
      };
      // Keep only the most recent 3 saves
      saves.unshift(record);
      while (saves.length > 3) saves.pop();
      localStorage.setItem(key, JSON.stringify(saves));
      showToast('Game saved ✓');
      logStatus('Game saved', 'success');
    }

    function loadSavedGameM() {
      const key   = 'mobileChessSave_' + (currentUser || 'guest');
      const saves = JSON.parse(localStorage.getItem(key) || '[]');
      if (!saves.length) { showToast('No saved games found'); return; }

      const latest = saves[0];
      game = new Chess();
      game.load(latest.fen);
      if (board) board.position(latest.fen);

      moveHistory     = latest.moves || [];
      capturedByWhite = latest.capturedW || [];
      capturedByBlack = latest.capturedB || [];

      renderMoveHistory();
      renderCapturedPieces();
      updateFenDisplayM();
      checkGameStatus();
      logStatus('Game loaded ✓', 'success');
      showToast('Game loaded');
    }

    // ────────────────────────────────────────────────────────────────────────
    // Expert Q&A
    // ────────────────────────────────────────────────────────────────────────
    function updateExpertContextBadgeM() {
      // Context badge not shown in mobile header to keep it clean;
      // the expert panel fetches fresh context each time.
    }

    function askExpertQuick(question) {
      const inp = document.getElementById('m-expert-input');
      if (inp) inp.value = question;
      sendExpertQuestion();
    }

    function sendExpertQuestion() {
      const inp = document.getElementById('m-expert-input');
      if (!inp) return;
      const question = inp.value.trim();
      if (!question) return;
      inp.value = '';

      const answers = document.getElementById('m-expert-answers');
      if (!answers) return;

      // Add pending entry
      const id = 'eq-' + Date.now();
      const entry = document.createElement('div');
      entry.id = id;
      entry.className = 'm-expert-qa';
      entry.innerHTML = `
        <div class="m-expert-question">${escapeHtml(question)}</div>
        <div class="m-expert-answer" style="color:#999;">Thinking…</div>`;
      answers.insertBefore(entry, answers.firstChild);

      const fen = game ? game.fen() : 'start';
      logComm('req', 'ENGINE', '/expert/question', { question });
      let _st = null;
      fetch('/expert/question', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + authToken
        },
        body: JSON.stringify({ question, fen, context: 'Mobile game' })
      })
        .then(r => { _st = r.status; return r.json(); })
        .then(data => {
          logComm('res', 'ENGINE', '/expert/question', data, _st);
          const ansEl = document.getElementById(id)?.querySelector('.m-expert-answer');
          if (ansEl) ansEl.textContent = data.answer || 'No answer received.';
        })
        .catch(e => {
          logComm('err', 'ENGINE', '/expert/question', { message: e.message });
          const ansEl = document.getElementById(id)?.querySelector('.m-expert-answer');
          if (ansEl) ansEl.textContent = 'Error: ' + e.message;
        });
    }

    function escapeHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ────────────────────────────────────────────────────────────────────────
    // Tab Navigation
    // ────────────────────────────────────────────────────────────────────────
    function switchMobileTab(name) {
      document.querySelectorAll('.m-tab-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.m-tab-btn').forEach(b => b.classList.remove('active'));
      const panel = document.getElementById('m-panel-' + name);
      const btn   = document.getElementById('m-tab-btn-' + name);
      if (panel) panel.classList.add('active');
      if (btn)   btn.classList.add('active');
    }

    // ────────────────────────────────────────────────────────────────────────
    // Status Log
    // ────────────────────────────────────────────────────────────────────────
    function logStatus(message, type) {
      const log = document.getElementById('m-status-log');
      if (!log) return;
      const t   = new Date().toLocaleTimeString();
      const cls = type === 'success' ? 'sl-success'
                : type === 'error'   ? 'sl-error'
                : 'sl-info';
      const entry = document.createElement('div');
      entry.innerHTML = `<span class="sl-time">[${t}]</span> <span class="${cls}">${escapeHtml(message)}</span>`;
      log.insertBefore(entry, log.firstChild);
      // Keep at most 15 entries
      while (log.children.length > 15) log.removeChild(log.lastChild);
    }

    // ────────────────────────────────────────────────────────────────────────
    // Toast Notification
    // ────────────────────────────────────────────────────────────────────────
    let _toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('m-toast');
      if (!el) return;
      el.textContent = msg;
      el.classList.add('visible');
      if (_toastTimer) clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => el.classList.remove('visible'), 2200);
    }

    // ────────────────────────────────────────────────────────────────────────
    // Activity Status
    // ────────────────────────────────────────────────────────────────────────
    function postActivityM(status) {
      if (!authToken) return;
      fetch('/auth/activity', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + authToken
        },
        body: JSON.stringify({ status })
      }).catch(() => {});
    }

    // ────────────────────────────────────────────────────────────────────────
    // Communication Log (buffer used by Expert tab; not shown on mobile)
    // ────────────────────────────────────────────────────────────────────────
    function logComm(direction, service, endpoint, data, statusCode) {
      const sanitized = Object.assign({}, data);
      if (sanitized.password !== undefined) sanitized.password = '***';
      if (sanitized.token    !== undefined) sanitized.token    = '(token)';
      commMessages.push({ ts: new Date().toLocaleTimeString(), direction, service, endpoint, data: sanitized, statusCode });
      if (commMessages.length > 100) commMessages.shift();
    }

    // ────────────────────────────────────────────────────────────────────────
    // Bootstrap
    // ────────────────────────────────────────────────────────────────────────
    window.onload = checkAuthentication;
  </script>
</body>
</html>
