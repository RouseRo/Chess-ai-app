          skillLevel = parseInt(document.getElementById('black-skill-level').value) || 10;
        }

        console.log('[UI] Sending to engine:', { move, fen, requestAiMove, aiType, skillLevel });
        logCommMessage('req', 'ENGINE', '/move', { move, fen, request_ai_move: requestAiMove, ai_type: aiType, skill_level: skillLevel }, null);
        let _moveStatus = null;
    
        fetch('/move', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + authToken
        },
        body: JSON.stringify({
          move: move, 
          fen: fen,
          request_ai_move: requestAiMove,
          ai_type: aiType,
          skill_level: skillLevel
        })
      })
        .then(response => {
          console.log('[UI] Response status:', response.status);
          _moveStatus = response.status;
          if (response.status === 401) {
            updateStatusBox('Authentication failed. Please login again.', 'error');
            handleLogout();
            throw new Error('Unauthorized');
          }
          return response.json();
        })
        .then(data => {
          console.log('[UI] Response data:', data);
          logCommMessage('res', 'ENGINE', '/move', data, _moveStatus);

          if (data.error) {
            updateStatusBox(`Server error: ${data.error}`, 'error');
            return;
          }

          updateStatusBox(`Move confirmed by server`, 'success');

          // Handle AI move response
          if (data.ai_move) {
            console.log('[UI] AI move received:', data.ai_move);

            // Parse the AI move (format: "e7e5" or "e7e5q" for promotion)
            const from = data.ai_move.substring(0, 2);
            const to = data.ai_move.substring(2, 4);
            const promotion = data.ai_move.length > 4 ? data.ai_move[4] : undefined;

            console.log('[UI] Parsed AI move:', { from, to, promotion });

            // Apply the AI move to our local game
            const aiMoveResult = game.move({
              from: from,
              to: to,
              promotion: promotion || 'q'
            });

            console.log('[UI] AI move result:', aiMoveResult);

            if (aiMoveResult) {
              // Update the board display
              board.position(game.fen());
              updateCapturedPieces(aiMoveResult);

              // Update move history with SAN notation
              const sanMove = data.ai_move_san || aiMoveResult.san;
              updateMoveHistory(sanMove, currentOpponent || 'AI');
              updateFenDisplay();
              updateStatusBox(`AI played: ${sanMove} (${data.ai_type})`, 'info');
              checkGameStatus();
              saveGame();
              updateExpertContextBadge();

              // Check if game is over
              if (!game.in_checkmate() && !game.in_draw() && !game.in_stalemate()) {
                // If next player is also AI, request their move automatically
                const whitePlayer = document.getElementById('white-player').value;
                const blackPlayer = document.getElementById('black-player').value;
                const isWhiteTurn = game.turn() === 'w';

                if ((isWhiteTurn && whitePlayer === 'ai') || (!isWhiteTurn && blackPlayer === 'ai')) {
                  // Request next AI move after a short delay
                  setTimeout(() => {
                    sendMoveToEngine('', game.fen(), true);
                  }, 1000);
                }
              }
            } else {
              console.error('[UI] Failed to apply AI move:', data.ai_move);
              updateStatusBox(`Failed to apply AI move: ${data.ai_move}`, 'error');

              // Try to sync with server FEN
              if (data.fen) {
                game.load(data.fen);
                board.position(data.fen);
                updateFenDisplay();
                updateStatusBox(`Board synced with server`, 'info');
              }
            }
          }
        })
        .catch(error => {
          if (error.message !== 'Unauthorized') {
            console.error('[UI] Error:', error);
            updateStatusBox(`Connection error: ${error.message}`, 'error');
            logCommMessage('err', 'ENGINE', '/move', { message: error.message }, null);
          }
        });
    }

          // ---- H vs H board sync helpers ----

                function updateSyncGameIdDisplay() {
                  const box = document.getElementById('sync-game-id-box');
                  const val = document.getElementById('sync-game-id-value');
                  if (!box || !val) return;
                  if (isSyncGame && syncGameId) {
                    val.textContent = syncGameId;
                    box.style.display = 'block';
                  } else {
                    box.style.display = 'none';
                  }
                }

          function publishGameSync(lastMove, lastMoveSan, movedBy) {
            if (!syncGameId || !authToken || !game) return;
            const whiteNameEl = document.getElementById('white-human-name');
            const blackNameEl = document.getElementById('black-human-name');
            fetch('/game/sync', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
              body: JSON.stringify({
                game_id: syncGameId,
                fen: game.fen(),
                last_move: lastMove,
                last_move_san: lastMoveSan,
                moved_by: movedBy,
                white_player: whiteNameEl ? whiteNameEl.value.trim() : '',
                black_player: blackNameEl ? blackNameEl.value.trim() : ''
              })
            }).catch(() => { });
          }

          function pollGameSync() {
            if (!syncGameId || !authToken || !isSyncGame || !game) return;
            fetch('/game/sync/' + syncGameId, {
              headers: { 'Authorization': 'Bearer ' + authToken }
            })
              .then(r => r.json())
              .then(data => {
                if (!data.found || !data.fen) return;
                // Skip if this is our own last published state or nothing changed
                if (data.fen === lastSyncFen) return;
                if (data.fen === game.fen()) { lastSyncFen = data.fen; return; }
                // Skip if we were the one who made this move
                if (data.moved_by === currentUser) { lastSyncFen = data.fen; return; }

                lastSyncFen = data.fen;

                // Try to apply via the stored last_move
                let applied = false;
                if (data.last_move && data.last_move.length >= 4) {
                  const from = data.last_move.substring(0, 2);
                  const to = data.last_move.substring(2, 4);
                  const promotion = data.last_move.length > 4 ? data.last_move[4] : 'q';
                  const result = game.move({ from, to, promotion });
                  if (result) {
                    applied = true;
                    board.position(game.fen());
                    updateMoveHistory(data.last_move_san || result.san, data.moved_by || 'Opponent');
                    updateCapturedPieces(result);
                    updateFenDisplay();
                    updateStatusBox((data.moved_by || 'Opponent') + ' played: ' + (data.last_move_san || result.san), 'info');
                    logCommMessage('info', 'SYNC', '/game/sync/' + syncGameId, {
                      move_from: data.moved_by || 'opponent',
                      move: data.last_move_san || result.san,
                      uci: data.last_move
                    }, null);
                    checkGameStatus();
                    saveGame();
                    updateExpertContextBadge();
                  }
                }
                if (!applied) {
                  // Fallback: load the FEN directly
                  game.load(data.fen);
                  board.position(data.fen);
                  updateFenDisplay();
                  checkGameStatus();
                  updateStatusBox('Board synced with opponent', 'info');
                }
              })
              .catch(() => { });
          }

        function buildExpertGameContext() {
          if (!game) return null;
          const sanMoves = moveHistory.map(m => m.move);
          return {
            fen: game.fen(),
            move_history: sanMoves,
            move_count: Math.ceil(sanMoves.length / 2),
            turn: game.turn() === 'w' ? 'white' : 'black',
            is_check: game.in_check(),
            is_checkmate: game.in_checkmate(),
            is_draw: game.in_draw(),
            captured_by_white: [...capturedByWhite],
            captured_by_black: [...capturedByBlack]
          };
        }

        function updateExpertContextBadge() {
          const badge = document.getElementById('expert-game-context');
          const summary = document.getElementById('expert-context-summary');
          if (!badge || !summary || !game) return;
          const moveCount = Math.ceil(moveHistory.length / 2);
          if (moveCount === 0) {
            badge.style.display = 'none';
            return;
          }
          badge.style.display = 'block';
          const turn = game.turn() === 'w' ? 'White' : 'Black';
          let status = `move ${moveCount}, ${turn} to move`;
          if (game.in_checkmate()) status = 'game over — checkmate';
          else if (game.in_draw()) status = 'game over — draw';
          else if (game.in_check()) status += ', in check';
          summary.textContent = status;
        }

        function addExpertQA(question, answer, isError) {
          const container = document.getElementById('expert-response');
          if (!container) return;
          // Remove placeholder
          const placeholder = container.querySelector('p');
          if (placeholder) placeholder.remove();

          const entry = document.createElement('div');
          entry.className = 'expert-qa-entry';
          const qDiv = document.createElement('div');
          qDiv.className = 'expert-qa-question';
          qDiv.textContent = question;
          const aDiv = document.createElement('div');
          aDiv.className = 'expert-qa-answer';
          if (isError) {
            aDiv.style.color = '#c62828';
            aDiv.textContent = answer;
          } else {
            aDiv.innerHTML = answer;
          }
          entry.appendChild(qDiv);
          entry.appendChild(aDiv);
          // Prepend so newest is at top
          container.insertBefore(entry, container.firstChild);
        }

        function askExpertPreset(question) {
          const input = document.getElementById('expert-input');
          if (input) input.value = question;
          askExpert();
        }

      function askExpert() {
        const question = document.getElementById('expert-input').value.trim();
        if (!question) {
          updateStatusBox('Please enter a question', 'error');
          return;
        }

        // --- loading state ---
        document.body.style.cursor = 'wait';
        document.querySelectorAll('.expert-quick-btn, .expert-send-btn').forEach(btn => {
          btn.disabled = true;
          btn.classList.add('expert-loading');
        });
        function _clearExpertLoading() {
          document.body.style.cursor = '';
          document.querySelectorAll('.expert-quick-btn, .expert-send-btn').forEach(btn => {
            btn.disabled = false;
            btn.classList.remove('expert-loading');
          });
        }

        updateStatusBox(`Asking expert: "${question}"`, 'info');
        document.getElementById('expert-input').value = '';

        const ctx = buildExpertGameContext();
        const payload = { question, ...(ctx || {}) };

        logCommMessage('req', 'ENGINE', '/expert/question', { question, fen: ctx ? ctx.fen : null }, null);
        let _expertStatus = null;
        fetch('/expert/question', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + authToken
          },
          body: JSON.stringify(payload)
        })
          .then(response => {
            _expertStatus = response.status;
            if (response.status === 401) {
              updateStatusBox('Authentication failed. Please login again.', 'error');
              handleLogout();
              throw new Error('Unauthorized');
            }
            return response.json();
          })
          .then(data => {
            logCommMessage('res', 'ENGINE', '/expert/question', data, _expertStatus);
            if (data.error) {
              _clearExpertLoading();
              addExpertQA(question, 'Error: ' + data.error, true);
              updateStatusBox(`Expert error: ${data.error}`, 'error');
            } else {
              _clearExpertLoading();
              addExpertQA(question, data.response || 'No response', false);
              updateStatusBox('Expert response received', 'success');
            }
          })
          .catch(error => {
            _clearExpertLoading();
            if (error.message !== 'Unauthorized') {
              logCommMessage('err', 'ENGINE', '/expert/question', { message: error.message }, null);
              addExpertQA(question, 'Connection error: ' + error.message, true);
              updateStatusBox(`Expert connection error: ${error.message}`, 'error');
            }
          });
      }

      function handleLogout() {
        if (confirm('Are you sure you want to logout?')) {
          if (syncPollInterval) { clearInterval(syncPollInterval); syncPollInterval = null; }
          isSyncGame = false;
          logCommMessage('req', 'AUTH', '/auth/logout', {}, null);
          fetch('/auth/logout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: authToken })
          })
            .then(() => {
              authToken = null;
              currentUser = null;
              localStorage.removeItem('authToken');
              localStorage.removeItem('currentUser');
              localStorage.removeItem('isAdmin');
              showLoginInterface();
            })
            .catch(error => console.error('Logout error:', error));
        }
      }

      window.onload = checkAuthentication;
  </script>
