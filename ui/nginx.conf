server {
    listen 80;

    # Serve static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Prevent browsers from caching HTML pages so deploys are picked up immediately
    location ~* \.html$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
    # Auth service: /auth/, /community/, /rewards/
    # Uses external ACA URL (stable, avoids internal Envoy routing issues)
    location /auth/ {
        proxy_pass https://chess-auth.calmdesert-0b7461a5.eastus.azurecontainerapps.io/auth/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host chess-auth.calmdesert-0b7461a5.eastus.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /admin-auth/ {
        proxy_pass https://chess-auth.calmdesert-0b7461a5.eastus.azurecontainerapps.io/admin-auth/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host chess-auth.calmdesert-0b7461a5.eastus.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /community/ {
        proxy_pass https://chess-auth.calmdesert-0b7461a5.eastus.azurecontainerapps.io/community/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host chess-auth.calmdesert-0b7461a5.eastus.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /rewards/ {
        proxy_pass https://chess-auth.calmdesert-0b7461a5.eastus.azurecontainerapps.io/rewards/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host chess-auth.calmdesert-0b7461a5.eastus.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /feedback/ {
        proxy_pass https://chess-auth.calmdesert-0b7461a5.eastus.azurecontainerapps.io/feedback/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host chess-auth.calmdesert-0b7461a5.eastus.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Admin service: /admin/
    # Uses internal ACA FQDN (bypasses corrupted K8s ClusterIP Envoy routing)
    location /admin/ {
        proxy_pass https://chess-admin.internal.calmdesert-0b7461a5.eastus.azurecontainerapps.io/admin/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host chess-admin.internal.calmdesert-0b7461a5.eastus.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Chess engine: /move, /game/, /expert/
    location /engine-health {
        proxy_pass http://chess-engine.k8se-apps.svc.cluster.local/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    location /move {
        proxy_pass http://chess-engine.k8se-apps.svc.cluster.local/move;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /game/ {
        proxy_pass http://chess-engine.k8se-apps.svc.cluster.local/game/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /expert/ {
        proxy_pass http://chess-engine.k8se-apps.svc.cluster.local/expert/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
